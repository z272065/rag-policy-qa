<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业制度助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="result">
        <div id="welcome">
            <p id="welcome_text">嗨，我是企业制度问答助手，想问关于公司点什么</p>
            <div id="examples">
                <button class="example" type="button">年假有几天？怎么申请？</button>
                <button class="example" type="button">加班 8 小时，加班费多少？</button>
                <button class="example" type="button">公积金缴存比例是多少？</button>
                <button class="example" type="button">公司班车几点发车？</button>
            </div>
        </div>
        <div id="answer"></div>
        <div id="answer_card"></div>
    </div>
    <form id="form">
        <input id="input" type="text" placeholder="想问点什么">
        <button id="submit_button" type="submit">提交</button>
    </form>
    <script src="app.js"></script>
</body>
</html>
